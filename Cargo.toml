[package]
name = "frogquad"
version = "0.4.16"
authors = ["not-fl3 <not.fl3@gmail.com>"]
edition = "2024"
description = """
Simple and easy to use graphics library
"""
readme="README.md"
license = "MIT OR Apache-2.0"

[features]
log-rs = ["log"]
glam-serde = ["glam/serde"]
default = []

[package.metadata.android]
assets = "examples/"

[profile.dev.package."*"]
opt-level = 3

[package.metadata.docs.rs]
all-features = true

[dependencies]
miniquad = { version = "=0.4.11", features = ["log-impl"] }
quad-rand = "0.2.3"
glam = { version = "0.27", features = ["scalar-math"] }
image = { version = "0.24", default-features = false, features = ["png", "tga"] }
frogquad_macro = { version = "0.1.8", path = "frogquad_macro" }
fontdue = "0.9"
backtrace = { version = "0.3.60", optional = true }
log = { version = "0.4", optional = true }

[dev-dependencies]
frogquad-particles = { path = "./particles" }
frogquad-tiled = { path = "./tiled" }
frogquad-platformer = { path = "./physics-platformer" }

# workaround to fix the examples
# this allows to use frogquad-particles in examples without two versions of frogquad
[patch.crates-io]
frogquad = { path = './' }

#quad-snd = {path = '../quad-snd'}
#miniquad = { path = '../miniquad' }
#quad-gl = {path = './quad-gl'}

